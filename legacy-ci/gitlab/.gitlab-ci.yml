# Simulated GitLab on-prem CI/CD — PetClinic
# Migration target: pipelines/azure-pipelines.yml + pipelines/github-actions/

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE/petclinic"
  DEPLOY_HOST: "vm-dev-02.corp.example"

stages:
  - build
  - test
  - package
  - publish
  - deploy

default:
  image: eclipse-temurin:17-jdk
  tags:
    - onprem-linux-runner
  before_script:
    - chmod +x mvnw

build:
  stage: build
  script:
    - ./mvnw -B -DskipTests compile
  artifacts:
    paths:
      - target/
    expire_in: 1 day

unit_test:
  stage: test
  script:
    - ./mvnw -B test
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml

docker_build:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHA -t $DOCKER_IMAGE:latest .
    - docker push $DOCKER_IMAGE:$CI_COMMIT_SHA
    - docker push $DOCKER_IMAGE:latest
  only:
    - main
    - develop

deploy_dev:
  stage: deploy
  environment:
    name: development
    url: http://$DEPLOY_HOST:8080
  script:
    - apk add --no-cache openssh-client curl
    - ssh -o StrictHostKeyChecking=no deploy@$DEPLOY_HOST "
        docker pull $DOCKER_IMAGE:$CI_COMMIT_SHA &&
        docker run -d --rm -p 8080:8080 -e SPRING_PROFILES_ACTIVE=dev $DOCKER_IMAGE:$CI_COMMIT_SHA"
    - curl -f http://$DEPLOY_HOST:8080/actuator/health
  when: manual
  only:
    - develop

deploy_prod:
  stage: deploy
  environment:
    name: production
    url: https://petclinic.corp.example
  script:
    - echo "Production deploy requires change ticket CHG-$(date +%Y%m%d)"
    - ssh deploy@prod-vm.corp.example "docker pull $DOCKER_IMAGE:$CI_COMMIT_SHA && ./deploy.sh"
  when: manual
  only:
    - main
  needs:
    - docker_build
