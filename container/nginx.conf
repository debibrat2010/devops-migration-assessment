# Module D — Local ingress proxy (simulates App Gateway / NGINX Ingress)
worker_processes 1;
events { worker_connections 1024; }

http {
    # Upstream name must not use underscores — Tomcat 11 rejects Host headers with _
    upstream petclinic {
        server app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://petclinic;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /actuator/health {
            proxy_pass http://petclinic/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            access_log off;
        }
    }
}
