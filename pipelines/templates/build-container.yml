parameters:
  - name: dockerfilePath
    type: string
    default: 'container/Dockerfile'
  - name: imageRepository
    type: string
    default: 'petclinic'
  - name: containerRegistry
    type: string
    default: '$(acrLoginServer)'
  - name: tag
    type: string
    default: '$(Build.BuildId)'

steps:
  - task: Maven@4
    displayName: 'Maven test (hosted fallback)'
    inputs:
      mavenPomFile: 'apps/spring-petclinic/pom.xml'
      goals: 'test'
      jdkVersionOption: '1.17'
    condition: eq(variables['Agent.OS'], 'Linux_NT')

  # App Service Linux hosts are amd64 — self-hosted agent on Apple Silicon builds arm64 by default
  - task: Docker@2
    displayName: 'Build container image (linux/amd64)'
    inputs:
      command: build
      dockerfile: '${{ parameters.dockerfilePath }}'
      buildContext: '$(Build.SourcesDirectory)'
      repository: '${{ parameters.imageRepository }}'
      arguments: '--platform linux/amd64'
      tags: |
        ${{ parameters.tag }}
        $(Build.SourceVersion)

  - script: |
      echo "Image architecture (must be amd64 for Azure App Service):"
      docker image inspect "${IMAGE_REPO}:${BUILD_TAG}" --format 'arch={{.Architecture}} os={{.Os}}'
      arch=$(docker image inspect "${IMAGE_REPO}:${BUILD_TAG}" --format '{{.Architecture}}')
      if [ "$arch" != "amd64" ]; then
        echo "##vso[task.logissue type=error]Expected amd64 image; got $arch. App Service will show Application Error."
        exit 1
      fi
    displayName: 'Verify image architecture'
    env:
      IMAGE_REPO: ${{ parameters.imageRepository }}
      BUILD_TAG: ${{ parameters.tag }}

  # Build tags locally as petclinic:3 — ACR push needs registry/login-server/repo:tag
  # Use env: — bash $(VAR) is command substitution; ADO macros belong in env block
  - script: |
      set -euo pipefail
      docker tag "${IMAGE_REPO}:${BUILD_TAG}" "${ACR_LOGIN_SERVER}/${IMAGE_REPO}:${BUILD_TAG}"
      docker tag "${IMAGE_REPO}:${SOURCE_VERSION}" "${ACR_LOGIN_SERVER}/${IMAGE_REPO}:${SOURCE_VERSION}"
      echo "Tagged for push:"
      docker images "${ACR_LOGIN_SERVER}/${IMAGE_REPO}" --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}"
    displayName: 'Tag image for ACR'
    env:
      ACR_LOGIN_SERVER: $(acrLoginServer)
      IMAGE_REPO: ${{ parameters.imageRepository }}
      BUILD_TAG: ${{ parameters.tag }}
      SOURCE_VERSION: $(Build.SourceVersion)

  - task: Docker@2
    displayName: 'Push to ACR'
    inputs:
      command: push
      containerRegistry: '$(acrServiceConnection)'
      repository: '${{ parameters.imageRepository }}'
      tags: |
        ${{ parameters.tag }}
        $(Build.SourceVersion)
