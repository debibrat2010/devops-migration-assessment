parameters:
  - name: dockerfilePath
    type: string
    default: 'container/Dockerfile'
  - name: imageRepository
    type: string
    default: 'petclinic'
  - name: containerRegistry
    type: string
    default: '$(acrLoginServer)'
  - name: tag
    type: string
    default: '$(Build.BuildId)'

steps:
  - task: Maven@4
    displayName: 'Maven test (hosted fallback)'
    inputs:
      mavenPomFile: 'apps/spring-petclinic/pom.xml'
      goals: 'test'
      jdkVersionOption: '1.17'
    condition: eq(variables['Agent.OS'], 'Linux_NT')

  - task: Docker@2
    displayName: 'Build container image'
    inputs:
      command: build
      dockerfile: '${{ parameters.dockerfilePath }}'
      buildContext: '$(Build.SourcesDirectory)'
      repository: '${{ parameters.imageRepository }}'
      tags: |
        ${{ parameters.tag }}
        $(Build.SourceVersion)

  # Build tags locally as petclinic:3 — ACR push needs registry/login-server/repo:tag
  - script: |
      set -euo pipefail
      ACR="$(acrLoginServer)"
      REPO="${{ parameters.imageRepository }}"
      docker tag "${REPO}:${{ parameters.tag }}" "${ACR}/${REPO}:${{ parameters.tag }}"
      docker tag "${REPO}:$(Build.SourceVersion)" "${ACR}/${REPO}:$(Build.SourceVersion)"
      echo "Tagged for push:"
      docker images "${ACR}/${REPO}" --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}"
    displayName: 'Tag image for ACR'

  - task: Docker@2
    displayName: 'Push to ACR'
    inputs:
      command: push
      containerRegistry: '$(acrServiceConnection)'
      repository: '${{ parameters.imageRepository }}'
      tags: |
        ${{ parameters.tag }}
        $(Build.SourceVersion)
