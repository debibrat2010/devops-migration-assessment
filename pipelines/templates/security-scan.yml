parameters:
  - name: imageRef
    type: string
    default: '$(acrLoginServer)/petclinic:$(Build.BuildId)'

steps:
  - task: Docker@2
    displayName: 'Login to ACR (private registry scan)'
    inputs:
      command: login
      containerRegistry: '$(acrServiceConnection)'

  - script: |
      trivy image --severity CRITICAL,HIGH --exit-code 0 \
        --format table -o $(Build.ArtifactStagingDirectory)/trivy-report.txt \
        "${{ parameters.imageRef }}"
      cat $(Build.ArtifactStagingDirectory)/trivy-report.txt
    displayName: 'Trivy vulnerability scan'
    continueOnError: false

  - publish: '$(Build.ArtifactStagingDirectory)/trivy-report.txt'
    artifact: trivy-scan-report
    displayName: 'Publish scan report'
